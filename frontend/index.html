<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Smart Assistant</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f9;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      #chat-container {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .message {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 8px;
        line-height: 1.5;
        word-wrap: break-word;
      }

      .user-message {
        background-color: #007bff;
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 0;
      }

      .bot-message {
        background-color: #e5e5ea;
        color: black;
        align-self: flex-start;
        border-bottom-left-radius: 0;
        white-space: pre-wrap;
      }

      #input-container {
        display: flex;
        padding: 10px;
        background: white;
        border-top: 1px solid #ddd;
      }

      #user-input {
        flex: 1;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
        outline: none;
      }

      #send-button {
        padding: 12px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        margin-left: 10px;
        cursor: pointer;
        font-size: 16px;
      }

      #send-button:hover {
        background-color: #0056b3;
      }

      .loading {
        align-self: flex-start;
        background-color: transparent;
        color: #888;
        font-style: italic;
        display: none;
        margin-left: 20px;
      }
    </style>
  </head>
  <body>
    <div id="chat-container">
      <div class="message bot-message">
        你好！我是厦小嘉，厦门大学嘉庚学院图书馆的专属智能助手。有什么我可以帮你的吗？
      </div>
    </div>
    <div class="loading" id="loading-indicator">厦小嘉正在思考...</div>
    <div id="input-container">
      <input
        type="text"
        id="user-input"
        placeholder="请输入你的问题..."
        autocomplete="off"
      />
      <button id="send-button">发送</button>
    </div>
    <script src="app.js"></script>
  </body>
</html>
